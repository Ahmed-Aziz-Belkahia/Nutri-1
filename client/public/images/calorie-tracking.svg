<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    .primary { fill: #85DED8; }
    .secondary { fill: #6BC7C1; }
    .accent { fill: #F8FAFC; }
  </style>
  <circle cx="100" cy="100" r="80" class="primary" opacity="0.2"/>
  <g transform="translate(50, 40)">
    <rect x="10" y="20" width="80" height="100" rx="8" class="secondary"/>
    <rect x="20" y="40" width="60" height="10" rx="2" class="accent"/>
    <rect x="20" y="60" width="40" height="10" rx="2" class="accent"/>
    <rect x="20" y="80" width="50" height="10" rx="2" class="accent"/>
    <circle cx="70" cy="30" r="15" class="primary"/>
    <text x="65" y="35" font-size="14" fill="#fff">kcal</text>
  </g>
</svg>
